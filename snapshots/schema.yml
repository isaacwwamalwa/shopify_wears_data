version: 2

snapshots:
  - name: snap_shopify_products
    description: "Historical record of Shopify product attributes. Uses the product updated_at timestamp to detect changes and preserve previous versions."

    columns:
      - name: product_id
        description: "Unique identifier for the Shopify product."

      - name: product_title
        description: "Product title captured at the time of the snapshot."

      - name: product_type
        description: "Product category or type captured at the time of the snapshot."

      - name: vendor
        description: "Product vendor captured at the time of the snapshot."

      - name: status
        description: "Shopify product status captured at the time of the snapshot."

      - name: created_at
        description: "Original product creation timestamp."

      - name: updated_at
        description: "Timestamp of the latest product update used by the snapshot strategy."

      - name: dbt_valid_from
        description: "Timestamp when this version of the product record became valid."

      - name: dbt_valid_to
        description: "Timestamp when this version stopped being valid. Null for the current version."

      - name: dbt_scd_id
        description: "Unique identifier generated by dbt for this snapshot version."

      - name: dbt_updated_at
        description: "Timestamp dbt uses to track when the snapshot version was updated."