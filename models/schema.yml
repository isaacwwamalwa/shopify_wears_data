
version: 2

models:
  - name: dim_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
  
  - name: fct_order_lines
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null
  
  - name: mart_daily_sales
    columns:
      - name: order_date
        data_tests:
          - not_null
